# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and test compte service
        run: mvn -B -f service-compte/pom.xml clean verify

      - name: Build and test utilisateur service
        run: mvn -B -f service-utilisateur/pom.xml clean verify

      - name: Build and test password service
        run: mvn -B -f service-gestion-password/pom.xml clean verify

      - name: Build and test note
        run: mvn -B -f service-notes/pom.xml clean verify

      - name: Run SonarQube scan for all services
        run: |
          mvn sonar:sonar -Dsonar.projectKey=Projet-java \
                          -Dsonar.projectName="Projet-java" \
                          -Dsonar.sources=service-compte/src/main/java,service-utilisateur/src/main/java,service-gestion-password/src/main/java,service-notes/src/main/java \
                          -Dsonar.tests=service-compte/src/test/java,service-utilisateur/src/test/java,service-gestion-password/src/test/java,service-notes/src/test/java \
                          -Dsonar.java.binaries=service-compte/target/classes,service-utilisateur/target/classes,service-gestion-password/target/classes,service-notes/target/classes
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Qualité SonarQube
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: service-compte/target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
