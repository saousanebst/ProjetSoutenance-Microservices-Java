name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Microservice 1
      - name: Build and Test Microservice 1
        run: |
          cd service-utilisateur
          mvn clean verify
          mvn org.jacoco:jacoco-maven-plugin:prepare-agent package
          mvn sonar:sonar \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.projectKey=Projet-java
          mvn org.jacoco:jacoco-maven-plugin:report
       - name: Run tests with debug information
          run: mvn clean test -X

      - name: Quality Gate Microservice 1
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          projectKey: Projet-java
          serverUrl: ${{ secrets.SONAR_HOST_URL }}
          token: ${{ secrets.SONAR_TOKEN }}