name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [service-compte, service-utilisateur, service-notes, service-gestion-password]

    env:
      DATABASE_NAME_COMPTE: bddcompte
      DATABASE_NAME_UTILISATEUR: bddutilisateur
      DATABASE_NAME_NOTE: bddnote

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file ${{ matrix.service }}/pom.xml

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -f ${{ matrix.service }}/pom.xml clean verify sonar:sonar \
            -Dsonar.projectKey=Projet-java-${{ matrix.service }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.junit.reportPaths=target/surefire-reports/*.xml \
            -Dsonar.test.inclusions=**/*.java

      - name: Run Unit Tests
        env:
          DATABASE_URL: "jdbc:postgresql://127.0.0.1:5432/${{ env['DATABASE_NAME_' + matrix.service.replace('-', '_').toUpperCase()] }}"
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: root
        run: |
          echo "Running unit tests for ${{ matrix.service }}"
          mvn -B test --file ${{ matrix.service }}/pom.xml

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
