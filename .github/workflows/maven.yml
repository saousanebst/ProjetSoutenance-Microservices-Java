name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [service-gestion-password, service-compte, service-notes, service-utilisateur]  # Liste des microservices à analyser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven  # Active la mise en cache des dépendances Maven pour améliorer le temps d'exécution

      - name: Build with Maven
        run: mvn -B package --file ${{ matrix.service }}/pom.xml

      - name: Run Unit Tests
        run: mvn -B test --file ${{ matrix.service }}/pom.xml

  sonarqube:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Utilisez le jeton SonarQube stocké dans les secrets du dépôt
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=Projet-java \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.sources=${{ matrix.service }}/src/main/java \
            -Dsonar.tests=${{ matrix.service }}/src/test/java \
            -Dsonar.java.binaries=${{ matrix.service }}/target/classes

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        with:
          scanMetadataReportFile: ${{ matrix.service }}/target/sonar/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
