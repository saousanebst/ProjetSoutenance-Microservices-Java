name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [service-compte, service-utilisateur, service-notes, service-gestion-password]  # Liste des microservices à analyser

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven  # Active la mise en cache des dépendances Maven pour améliorer le temps d'exécution

    - name: Build with Maven
      run: mvn -B package --file ${{ matrix.service }}/pom.xml

    - name: SonarQube Scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  # Utilisez le jeton SonarQube stocké dans les secrets du dépôt
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      run: |
        mvn -f ${{ matrix.service }}/pom.xml sonar:sonar \
          -Dsonar.projectKey=Projet-java-${{ matrix.service }} \
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}  # Configurez SonarQube pour chaque microservice

    - name: Run Unit Tests
      run: mvn -B test --file ${{ matrix.service }}/pom.xml  # Exécute les tests unitaires pour chaque microservice

    # Optionnel : Télécharge le graphe complet des dépendances sur GitHub pour améliorer la qualité des alertes Dependabot reçues par ce dépôt
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
